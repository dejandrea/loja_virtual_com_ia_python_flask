<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Funcionário</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card p-4 mx-auto" style="max-width: 400px;">
            <h1 class="mb-3 text-center">Login</h1>
            <p class="text-muted text-center">Faça login para acessar o painel de administração.</p>

            <input type="email" id="emailLogin" placeholder="E-mail" class="form-control mb-2" required>
            <input type="password" id="senhaLogin" placeholder="Senha" class="form-control mb-2" required>
            <button class="btn btn-primary w-100" id="btnLogin">Entrar</button>

            <p id="mensagemLogin" class="text-center mt-3"></p>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
